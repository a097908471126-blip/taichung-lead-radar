<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15181f">
<title>地推雷達 · 台中商圈開發</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15181f;
    --ink-soft:#232838;
    --paper:#f4f2ec;
    --paper-dim:#e8e5db;
    --signal:#ff5e2c;
    --signal-dim:#ffb199;
    --blue:#2f7dfb;
    --yellow:#f2a70b;
    --green:#1bad6b;
    --red:#e3403a;
    --line:#d8d4c6;
    --text-dim:#6b7280;
    font-family:'Noto Sans TC','PingFang TC',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;}
  body{display:flex;justify-content:center;}
  #app{
    width:100%;max-width:480px;height:100dvh;height:100vh;
    position:relative;background:var(--paper);
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }

  /* ---------- HEADER ---------- */
  #header{
    background:var(--ink);color:var(--paper);
    padding:10px 14px 12px;flex:0 0 auto;
    display:flex;flex-direction:column;gap:8px;z-index:40;
    border-bottom:3px solid var(--signal);
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .loc-block{display:flex;flex-direction:column;line-height:1.1;}
  .loc-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--signal-dim);text-transform:uppercase;}
  .loc-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.01em;}
  .brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:var(--paper-dim);letter-spacing:.08em;opacity:.6;}
  .header-actions{display:flex;gap:8px;}
  .hbtn{
    border:none;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;
    display:flex;align-items:center;gap:6px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;
    transition:transform .12s ease;
  }
  .hbtn:active{transform:scale(.94);}
  .hbtn.sync{background:var(--signal);color:#1a0d05;}
  .hbtn.filter{background:var(--ink-soft);color:var(--paper);border:1px solid #3a4055;position:relative;}
  .filter-dot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--signal);border:2px solid var(--ink);display:none;}
  .filter-dot.show{display:block;}
  .sync-icon{display:inline-block;}
  .sync-icon.spin{animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- MAP ---------- */
  #mapwrap{position:relative;flex:1 1 auto;min-height:0;}
  #map{width:100%;height:100%;}
  .leaflet-control-attribution{font-size:9px;}

  .toast{
    position:absolute;left:50%;top:14px;transform:translate(-50%,-140%);
    background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
    font-size:12.5px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.35);
    display:flex;align-items:center;gap:7px;z-index:60;transition:transform .28s cubic-bezier(.2,.8,.3,1.1);
    white-space:nowrap;
  }
  .toast.show{transform:translate(-50%,0);}
  .toast .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}

  .legend{
    position:absolute;left:10px;bottom:10px;background:rgba(21,24,31,.88);color:var(--paper);
    padding:7px 10px;border-radius:10px;font-size:10.5px;display:flex;gap:9px;z-index:30;
  }
  .legend span{display:flex;align-items:center;gap:4px;}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* leaflet marker pulse */
  .pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);position:relative;}
  .pin.pulse::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;animation:pulse 1.8s ease-out infinite;transform:rotate(0);}
  @keyframes pulse{0%{transform:scale(.5) rotate(45deg);opacity:.9;}100%{transform:scale(1.9) rotate(45deg);opacity:0;}}

  /* ---------- BOTTOM SHEET ---------- */
  #sheet{
    position:relative;flex:0 0 auto;background:var(--paper);
    border-top:1px solid var(--line);
    display:flex;flex-direction:column;min-height:40dvh;height:40dvh;
    z-index:35;touch-action:none;
    box-shadow:0 -6px 20px rgba(0,0,0,.15);
    transition:height .25s cubic-bezier(.2,.8,.3,1);
  }
  #sheet.dragging{transition:none;}
  #handle{flex:0 0 auto;padding:9px 0 6px;display:flex;flex-direction:column;align-items:center;cursor:grab;gap:6px;}
  #handle .bar{width:38px;height:4px;border-radius:2px;background:#c9c4b2;}
  #sheet-summary{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:.03em;}
  #sheet-summary b{color:var(--ink);}
  #list{flex:1 1 auto;overflow-y:auto;padding:2px 12px 18px;-webkit-overflow-scrolling:touch;}
  #list::-webkit-scrollbar{display:none;}

  .card{
    background:#fff;border-radius:14px;margin-bottom:10px;padding:12px 13px 11px;
    border-left:5px solid var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.06);
    display:flex;flex-direction:column;gap:8px;
  }
  .card.status-negotiating{border-color:var(--yellow);}
  .card.status-won{border-color:var(--green);}
  .card.status-lost{border-color:var(--red);opacity:.72;}
  .card-top{display:flex;justify-content:space-between;gap:8px;}
  .card-name{font-weight:700;font-size:15px;line-height:1.3;color:var(--ink);}
  .card-meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .card-dist{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12.5px;color:var(--ink);white-space:nowrap;text-align:right;}
  .card-dist small{display:block;font-weight:500;font-size:9.5px;color:var(--text-dim);}
  .card-addr{font-size:11.5px;color:var(--text-dim);}
  .tags{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{
    background:#fff4e0;color:#8a5300;border:1px solid #f2cf8f;font-size:10.5px;font-weight:700;
    padding:3px 7px;border-radius:6px;
  }
  .status-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;align-self:flex-start;}
  .status-chip.status-new{background:#e7f0ff;color:var(--blue);}
  .status-chip.status-negotiating{background:#fef3d6;color:#9a6a00;}
  .status-chip.status-won{background:#e2f7ec;color:var(--green);}
  .status-chip.status-lost{background:#fbe6e5;color:var(--red);}
  .card-actions{display:flex;gap:7px;margin-top:2px;}
  .abtn{
    flex:1;border:none;border-radius:9px;padding:9px 0;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:#fff;
  }
  .abtn:active{transform:scale(.96);}
  .abtn.nav{background:var(--ink);}
  .abtn.call{background:#3a4055;}
  .abtn.record{background:var(--signal);}
  .empty-state{text-align:center;padding:30px 10px;color:var(--text-dim);font-size:13px;}

  /* ---------- MODAL SHELL ---------- */
  .overlay{
    position:absolute;inset:0;background:rgba(15,17,22,.55);z-index:80;
    display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--paper);width:100%;border-radius:20px 20px 0 0;max-height:88%;
    display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.25,1);
  }
  .overlay.show .modal{transform:translateY(0);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;}
  .modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;color:var(--ink);}
  .modal-close{width:30px;height:30px;border-radius:50%;background:var(--paper-dim);border:none;font-size:16px;cursor:pointer;color:var(--ink);}
  .modal-body{padding:14px 18px 10px;overflow-y:auto;flex:1 1 auto;}
  .modal-foot{padding:12px 18px 18px;flex:0 0 auto;border-top:1px solid var(--line);}
  .primary-btn{
    width:100%;background:var(--signal);color:#1a0d05;border:none;border-radius:12px;padding:13px 0;
    font-size:15px;font-weight:800;cursor:pointer;font-family:'Noto Sans TC',sans-serif;
  }
  .primary-btn:active{transform:scale(.98);}

  /* filter form */
  .f-group{margin-bottom:18px;}
  .f-label{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .f-label .n{font-family:'JetBrains Mono',monospace;color:var(--signal);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-opt{
    padding:8px 13px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;
    color:var(--ink);cursor:pointer;user-select:none;
  }
  .chip-opt.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  /* record modal */
  .status-select{display:flex;gap:6px;margin-bottom:16px;}
  .status-opt{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 2px;text-align:center;font-size:11.5px;font-weight:700;color:var(--text-dim);cursor:pointer;}
  .status-opt .dotc{width:9px;height:9px;border-radius:50%;margin:0 auto 5px;}
  .status-opt.on{border-color:currentColor;background:rgba(0,0,0,.03);}
  .status-opt[data-s="new"]{color:var(--blue);}
  .status-opt[data-s="negotiating"]{color:var(--yellow);}
  .status-opt[data-s="won"]{color:var(--green);}
  .status-opt[data-s="lost"]{color:var(--red);}
  .status-opt .dotc{background:currentColor;}

  .photo-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
  .photo-add{
    flex:0 0 auto;width:74px;height:74px;border-radius:10px;border:1.5px dashed var(--line);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--text-dim);cursor:pointer;
  }
  .photo-thumb{flex:0 0 auto;width:74px;height:74px;border-radius:10px;overflow:hidden;position:relative;background:#000;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb .meta{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:7.5px;padding:3px 4px;line-height:1.3;font-family:'JetBrains Mono',monospace;}

  textarea.note{
    width:100%;min-height:96px;border-radius:10px;border:1.5px solid var(--line);padding:10px;font-size:13.5px;
    font-family:'Noto Sans TC',sans-serif;resize:vertical;background:#fff;color:var(--ink);
  }
  textarea.note:focus{outline:2px solid var(--signal);outline-offset:1px;}
  .voice-hint{font-size:10.5px;color:var(--text-dim);margin-top:5px;display:flex;align-items:center;gap:5px;}
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="header-top">
      <div class="loc-block">
        <span class="brand">地推雷達 · LEAD RADAR</span>
        <span class="loc-name">📍 <span id="locName">台中市西區</span></span>
      </div>
      <div class="header-actions">
        <button class="hbtn filter" id="filterBtn"><span>⚙️</span>篩選<span class="filter-dot" id="filterDot"></span></button>
        <button class="hbtn sync" id="syncBtn"><span class="sync-icon" id="syncIcon">🔄</span>更新</button>
      </div>
    </div>
  </div>

  <div id="mapwrap">
    <div id="map"></div>
    <div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>
    <div class="legend">
      <span><i style="background:#2f7dfb"></i>未拜訪</span>
      <span><i style="background:#f2a70b"></i>洽談中</span>
      <span><i style="background:#1bad6b"></i>已簽約</span>
      <span><i style="background:#e3403a"></i>已拒絕</span>
    </div>
  </div>

  <div id="sheet">
    <div id="handle"><div class="bar"></div><div id="sheet-summary">附近 <b id="countNum">0</b> 間店家 · 依距離排序</div></div>
    <div id="list"></div>
  </div>

  <!-- FILTER MODAL -->
  <div class="overlay" id="filterOverlay">
    <div class="modal">
      <div class="modal-head"><span class="modal-title">廣告痛點篩選</span><button class="modal-close" id="filterCloseX">✕</button></div>
      <div class="modal-body">
        <div class="f-group">
          <div class="f-label">搜尋半徑</div>
          <div class="chips" id="radiusChips">
            <div class="chip-opt" data-v="500">500m</div>
            <div class="chip-opt on" data-v="1000">1km</div>
            <div class="chip-opt" data-v="3000">3km</div>
          </div>
        </div>
        <div class="f-group">
          <div class="f-label">成立時間（推估）</div>
          <div class="chips" id="foundedChips">
            <div class="chip-opt" data-v="new">1年內新開幕</div>
            <div class="chip-opt" data-v="old">1～3年老店</div>
            <div class="chip-opt on" data-v="all">全選</div>
          </div>
        </div>
        <div class="f-group">
          <div class="f-label">數位足跡缺口 <span class="n">多選</span></div>
          <div class="chips" id="gapChips">
            <div class="chip-opt" data-v="noWebsite">無官方網站</div>
            <div class="chip-opt" data-v="noFB">無 FB 粉專</div>
            <div class="chip-opt" data-v="noIG">無 IG 帳號</div>
            <div class="chip-opt" data-v="noLine">無 LINE 官方</div>
          </div>
        </div>
        <div class="f-group">
          <div class="f-label">社群經營狀態 <span class="n">多選</span></div>
          <div class="chips" id="socialChips">
            <div class="chip-opt" data-v="fbStale">FB/IG 停更 > 90天</div>
            <div class="chip-opt" data-v="lowRating">Google 評分 < 3.8</div>
          </div>
        </div>
      </div>
      <div class="modal-foot"><button class="primary-btn" id="applyFilter">套用篩選</button></div>
    </div>
  </div>

  <!-- RECORD MODAL -->
  <div class="overlay" id="recordOverlay">
    <div class="modal">
      <div class="modal-head"><span class="modal-title" id="recordTitle">拜訪紀錄</span><button class="modal-close" id="recordCloseX">✕</button></div>
      <div class="modal-body">
        <div class="status-select" id="statusSelect">
          <div class="status-opt" data-s="new"><div class="dotc"></div>未拜訪</div>
          <div class="status-opt" data-s="negotiating"><div class="dotc"></div>洽談中</div>
          <div class="status-opt" data-s="won"><div class="dotc"></div>成功簽約</div>
          <div class="status-opt" data-s="lost"><div class="dotc"></div>已拒絕</div>
        </div>
        <div class="f-label">現場照片</div>
        <div class="photo-row" id="photoRow">
          <div class="photo-add" id="photoAdd">📷<span>拍照上傳</span></div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">
        <div class="f-label">備註</div>
        <textarea class="note" id="noteInput" placeholder="輸入拜訪重點，例如老闆態度、決策者、下次跟進時間…"></textarea>
        <div class="voice-hint">🎙️ 可使用手機系統鍵盤的語音輸入直接口述重點</div>
      </div>
      <div class="modal-foot"><button class="primary-btn" id="saveRecord">儲存紀錄</button></div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    {id:'s15', name:'豐盛小吃部', cat:'餐飲', addr:'台中市北區進化北路56號', lat:24.1613, lng:120.6862, founded:'new', noWebsite:true, noFB:true, noIG:true, noLine:true, fbStale:true, lowRating:false, rating:4.1},
  ];

  let stores = RAW_STORES.map(s => Object.assign({status:'new', note:'', photos:[]}, s));
  let filters = {radius:1000, founded:'all', gaps:[], social:[]};
  let userLoc = {lat:CENTER.lat, lng:CENTER.lng};
  let activeStoreId = null;

  function haversine(a,b){
    const R=6371000, toRad=d=>d*Math.PI/180;
    const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
    const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    return Math.round(R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s)));
  }

  function tagsFor(s){
    const t=[];
    if(s.noWebsite) t.push('⚠️ 無官方網站');
    if(s.fbStale) t.push('⚠️ FB 停更 > 90天');
    if(s.lowRating) t.push('⚠️ 評分偏低 < 3.8');
    if(s.noLine) t.push('⚠️ 無 LINE 官方');
    return t;
  }

  // ---------- MAP SETUP ----------
  const map = L.map('map', {zoomControl:false, attributionControl:true}).setView([CENTER.lat, CENTER.lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; OpenStreetMap'
  }).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);

  const userMarker = L.circleMarker([userLoc.lat, userLoc.lng], {
    radius:7, color:'#fff', weight:2, fillColor:'#ff5e2c', fillOpacity:1
  }).addTo(map).bindTooltip('目前位置');

  const markers = {};
  function makeIcon(status){
    const c = STATUS_COLOR[status];
    const pulse = status==='new' ? 'pulse' : '';
    return L.divIcon({
      className:'',
      html:`<div class="pin ${pulse}" style="background:${c};color:${c}"></div>`,
      iconSize:[22,22], iconAnchor:[11,20]
    });
  }
  stores.forEach(s=>{
    const m = L.marker([s.lat,s.lng], {icon:makeIcon(s.status)}).addTo(map);
    m.on('click', ()=> openRecord(s.id));
    markers[s.id] = m;
  });

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      userLoc = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      userMarker.setLatLng([userLoc.lat, userLoc.lng]);
      render();
    }, ()=>{ /* fallback stays at CENTER */ }, {timeout:4000});
  }

  // ---------- LIST / FILTER RENDER ----------
  function passesFilter(s){
    const d = haversine(userLoc, s);
    if(d > filters.radius) return false;
    if(filters.founded !== 'all' && s.founded !== filters.founded) return false;
    if(filters.gaps.length && !filters.gaps.some(g=>s[g])) return false;
    if(filters.social.length && !filters.social.some(g=>s[g])) return false;
    return true;
  }

  function render(){
    const visible = stores.filter(passesFilter).map(s=>({...s, dist:haversine(userLoc,s)})).sort((a,b)=>a.dist-b.dist);
    document.getElementById('countNum').textContent = visible.length;

    Object.entries(markers).forEach(([id,m])=>{
      const s = stores.find(x=>x.id===id);
      const show = passesFilter(s);
      m.setOpacity(show ? 1 : 0.18);
      m.setIcon(makeIcon(s.status));
    });

    const list = document.getElementById('list');
    if(!visible.length){
      list.innerHTML = `<div class="empty-state">此範圍內沒有符合條件的店家<br>試試放寬篩選半徑或痛點條件</div>`;
      return;
    }
    list.innerHTML = visible.map(s=>{
      const tags = tagsFor(s).map(t=>`<span class="tag">${t}</span>`).join('');
      return `
      <div class="card status-${s.status}" data-id="${s.id}">
        <div class="status-chip status-${s.status}">${STATUS_LABEL[s.status]}</div>
        <div class="card-top">
          <div>
            <div class="card-name">${s.name}</div>
            <div class="card-meta">${s.cat}</div>
          </div>
          <div class="card-dist">${s.dist}m<small>距離</small></div>
        </div>
        <div class="card-addr">${s.addr}</div>
        <div class="tags">${tags}</div>
        <div class="card-actions">
          <button class="abtn nav" data-act="nav" data-id="${s.id}">🚗 導航</button>
          <button class="abtn call" data-act="call" data-id="${s.id}">📞 電話</button>
          <button class="abtn record" data-act="record" data-id="${s.id}">📝 紀錄/打卡</button>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('list').addEventListener('click', e=>{
    const btn = e.target.closest('.abtn');
    if(!btn) return;
    const id = btn.dataset.id;
    const s = stores.find(x=>x.id===id);
    if(btn.dataset.act === 'nav'){
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`, '_blank');
    } else if(btn.dataset.act === 'call'){
      showToast('示範資料無實際電話號碼', '📞');
    } else if(btn.dataset.act === 'record'){
      openRecord(id);
    }
  });

  // ---------- TOAST ----------
  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  // ---------- SYNC BUTTON ----------
  document.getElementById('syncBtn').addEventListener('click', ()=>{
    const icon = document.getElementById('syncIcon');
    icon.classList.add('spin');
    setTimeout(()=>{
      icon.classList.remove('spin');
      const n = stores.filter(passesFilter).length;
      showToast(`已同步半徑內 ${n} 間店家的數位足跡資料`);
    }, 900);
  });

  // ---------- BOTTOM SHEET DRAG ----------
  const sheet = document.getElementById('sheet');
  const handle = document.getElementById('handle');
  const SNAPS = {peek:14, half:40, full:78}; // vh
  let dragStartY=0, dragStartH=0, dragging=false;

  function setSheetVh(vh){ sheet.style.height = vh+'dvh'; }

  function onDown(y){
    dragging=true; sheet.classList.add('dragging');
    dragStartY=y; dragStartH = sheet.getBoundingClientRect().height / window.innerHeight * 100;
  }
  function onMove(y){
    if(!dragging) return;
    const deltaVh = (dragStartY - y) / window.innerHeight * 100;
    let vh = Math.min(85, Math.max(10, dragStartH + deltaVh));
    setSheetVh(vh);
  }
  function onUp(){
    if(!dragging) return;
    dragging=false; sheet.classList.remove('dragging');
    const curVh = sheet.getBoundingClientRect().height / window.innerHeight * 100;
    const dists = Object.entries(SNAPS).map(([k,v])=>[k, Math.abs(v-curVh)]).sort((a,b)=>a[1]-b[1]);
    setSheetVh(SNAPS[dists[0][0]]);
  }
  handle.addEventListener('mousedown', e=>onDown(e.clientY));
  window.addEventListener('mousemove', e=>onMove(e.clientY));
  window.addEventListener('mouseup', onUp);
  handle.addEventListener('touchstart', e=>onDown(e.touches[0].clientY), {passive:true});
  window.addEventListener('touchmove', e=>{ if(dragging){ onMove(e.touches[0].clientY); } }, {passive:true});
  window.addEventListener('touchend', onUp);

  // ---------- FILTER MODAL ----------
  const filterOverlay = document.getElementById('filterOverlay');
  document.getElementById('filterBtn').addEventListener('click', ()=> filterOverlay.classList.add('show'));
  document.getElementById('filterCloseX').addEventListener('click', ()=> filterOverlay.classList.remove('show'));
  filterOverlay.addEventListener('click', e=>{ if(e.target===filterOverlay) filterOverlay.classList.remove('show'); });

  document.getElementById('radiusChips').addEventListener('click', e=>{
    const chip = e.target.closest('.chip-opt'); if(!chip) return;
    [...chip.parentElement.children].forEach(c=>c.classList.remove('on'));
    chip.classList.add('on');
  });
  document.getElementById('foundedChips').addEventListener('click', e=>{
    const chip = e.target.closest('.chip-opt'); if(!chip) return;
    [...chip.parentElement.children].forEach(c=>c.classList.remove('on'));
    chip.classList.add('on');
  });
  function multiToggle(containerId){
    document.getElementById(containerId).addEventListener('click', e=>{
      const chip = e.target.closest('.chip-opt'); if(!chip) return;
      chip.classList.toggle('on');
    });
  }
  multiToggle('gapChips'); multiToggle('socialChips');

  document.getElementById('applyFilter').addEventListener('click', ()=>{
    filters.radius = Number(document.querySelector('#radiusChips .on').dataset.v);
    filters.founded = document.querySelector('#foundedChips .on').dataset.v;
    filters.gaps = [...document.querySelectorAll('#gapChips .chip-opt.on')].map(c=>c.dataset.v);
    filters.social = [...document.querySelectorAll('#socialChips .chip-opt.on')].map(c=>c.dataset.v);
    const active = filters.founded!=='all' || filters.gaps.length || filters.social.length || filters.radius!==1000;
    document.getElementById('filterDot').classList.toggle('show', active);
    filterOverlay.classList.remove('show');
    render();
    showToast('已套用篩選條件');
  });

  // ---------- RECORD MODAL ----------
  const recordOverlay = document.getElementById('recordOverlay');
  let draftStatus='new', draftPhotos=[];

  async function openRecord(id){
    activeStoreId = id;
    const s = stores.find(x=>x.id===id);
    document.getElementById('recordTitle').textContent = s.name;
    draftStatus = s.status;
    draftPhotos = [...s.photos];
    document.getElementById('noteInput').value = s.note || '';
    renderStatusSelect();
    renderPhotoRow();
    recordOverlay.classList.add('show');

    // try to hydrate from persistent storage (in case of prior session)
    try{
      const raw = localStorage.getItem('visit:'+id);
      if(raw){
        const saved = JSON.parse(raw);
        draftStatus = saved.status || draftStatus;
        draftPhotos = saved.photos || draftPhotos;
        document.getElementById('noteInput').value = saved.note || '';
        renderStatusSelect(); renderPhotoRow();
      }
    }catch(err){ /* no prior record, ignore */ }
  }

  function renderStatusSelect(){
    document.querySelectorAll('.status-opt').forEach(el=>{
      el.classList.toggle('on', el.dataset.s === draftStatus);
    });
  }
  document.getElementById('statusSelect').addEventListener('click', e=>{
    const opt = e.target.closest('.status-opt'); if(!opt) return;
    draftStatus = opt.dataset.s;
    renderStatusSelect();
  });

  function renderPhotoRow(){
    const row = document.getElementById('photoRow');
    row.querySelectorAll('.photo-thumb').forEach(el=>el.remove());
    draftPhotos.forEach((p,idx)=>{
      const div = document.createElement('div');
      div.className='photo-thumb';
      div.innerHTML = `<img src="${p.dataUrl}"><div class="meta">${p.time}<br>${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</div>`;
      row.appendChild(div);
    });
  }

  document.getElementById('photoAdd').addEventListener('click', ()=> document.getElementById('photoInput').click());
  document.getElementById('photoInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const s = stores.find(x=>x.id===activeStoreId);
    const reader = new FileReader();
    reader.onload = ()=>{
      draftPhotos.push({
        dataUrl: reader.result,
        time: new Date().toLocaleString('zh-TW', {hour12:false}),
        lat: s.lat, lng: s.lng
      });
      renderPhotoRow();
    };
    reader.readAsDataURL(file);
    e.target.value='';
  });

  document.getElementById('recordCloseX').addEventListener('click', ()=> recordOverlay.classList.remove('show'));
  recordOverlay.addEventListener('click', e=>{ if(e.target===recordOverlay) recordOverlay.classList.remove('show'); });

  document.getElementById('saveRecord').addEventListener('click', async ()=>{
    const s = stores.find(x=>x.id===activeStoreId);
    s.status = draftStatus;
    s.note = document.getElementById('noteInput').value;
    s.photos = draftPhotos;

    try{
      localStorage.setItem('visit:'+s.id, JSON.stringify({status:s.status, note:s.note, photos:s.photos}));
    }catch(err){ /* storage unavailable (e.g. private browsing), state still updated in memory */ }

    recordOverlay.classList.remove('show');
    render();
    showToast(`已更新「${s.name}」為 ${STATUS_LABEL[s.status]}`);
  });

  // ---------- LOAD PERSISTED STATE ----------
  async function hydrateAll(){
    try{
      for(let i=0;i<localStorage.length;i++){
        const key = localStorage.key(i);
        if(!key || !key.startsWith('visit:')) continue;
        const id = key.replace('visit:','');
        const s = stores.find(x=>x.id===id);
        if(!s) continue;
        const raw = localStorage.getItem(key);
        if(raw){
          const saved = JSON.parse(raw);
          s.status = saved.status || s.status;
          s.note = saved.note || '';
          s.photos = saved.photos || [];
        }
      }
    }catch(err){ /* first run, nothing saved yet, or storage blocked */ }
    render();
  }

  render();
  hydrateAll();
})();
</script>
</body>
</html>
